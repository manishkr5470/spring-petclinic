name: Login to Azure Container Registry

on:
  push:
    branches:
      - stage
  workflow_dispatch:

jobs:
  login-acr:
    runs-on: ubuntu-latest

    steps:
      # Step to log in to Azure Container Registry using Docker
      - name: Log in to Azure Container Registry
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ inputs.login_server }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      # Step to verify the login by running 'docker info' to check the logged-in status
      - name: Verify Login
        run: |
          docker info
