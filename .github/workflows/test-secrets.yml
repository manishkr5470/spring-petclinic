name: Test GitHub Actions Secrets

on: 
  push:
    branches:
      - NA

jobs:
  test-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print Secret (Masked)
        run: echo "The secret is ${{ secrets.ACR_USERNAME }}"

      - name: Use Secret in an Environment Variable
        env:
          API_KEY: ${{ secrets.ACR_USERNAME }}
        run: |
          echo "Using secret in env"
          echo "API_KEY is set but masked"

      - name: Debug Secret Length (Avoid Printing Secret Directly)
        run: |
          echo "Secret length: ${#MY_SECRET}"
        env:
          MY_SECRET: ${{ secrets.ACR_USERNAME }}
